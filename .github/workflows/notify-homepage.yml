# 本仓库只负责「放代码」。/demo/ 是主站 ABitGinger.github.io 的静态页面，
# 由主站的 static.yml 在构建时 clone 本仓库并复制进它的 demo/ 目录。
# 所以这里推完代码后，还需要让主站重新跑一次构建。
#
# 主站自己每小时会定时构建一次，所以什么都不配也能最终同步；
# 想让「推完即上线」，就在本仓库配一个 Secret：
#   HOMEPAGE_DISPATCH_TOKEN = 具备 ABitGinger/ABitGinger.github.io 仓库
#                             Actions 写权限的 PAT（经典 PAT 勾选 repo + workflow）
# 没配这个 Secret 时本工作流会自动跳过，不会报错。
name: 通知主站重新构建

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 ABitGinger.github.io 重新构建
        env:
          TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
          TARGET_REPO: ABitGinger/ABitGinger.github.io
          TARGET_WORKFLOW: static.yml
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::notice title=跳过::未配置 HOMEPAGE_DISPATCH_TOKEN，主站会按它自己的定时任务同步 /demo/。"
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/resp.txt || true
          if [ "${code}" != "204" ]; then
            echo "::error title=触发失败::HTTP ${code}，检查 HOMEPAGE_DISPATCH_TOKEN 是否对 ${TARGET_REPO} 有 Actions 写权限。"
            exit 1
          fi
          echo "已触发主站重新构建，大约 1 分钟后 /demo/ 即是最新内容。"
