# 演示厅的本体部署：本仓库自己的 GitHub Pages。
#
# 对外地址：https://abitginger.top/WebDemos/
#   （项目站点的路径固定等于仓库名；abitginger.github.io 是别名，会 301 过去）
# 单个演示：https://abitginger.top/WebDemos/demos/<slug>/
#
# 零构建：仓库里的文件就是站点产物，直接上传整个仓库。
# upload-pages-artifact 会永远排除 .git 与 .github，并且默认排除根目录下所有点开头的
# 文件（include-hidden-files 默认 false），所以工作流和 .gitignore 不会出现在站点上。
# README.md / ADDEMO.md / scripts/ 会被发布出去，但仓库本来就是公开的，无所谓。
#
# ⚠️ 首次部署必须手动开一次：仓库 Settings → Pages → Source 选 GitHub Actions。
#    不要让工作流去开 —— 那需要 PAT，见下面 Setup Pages 那一步的注释。
name: 部署演示厅

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # 清单与目录对不上时给出提示，但不阻断部署（避免一个笔误把站点卡住）
      - name: 校验 demos.json
        continue-on-error: true
        run: python scripts/check.py

      # 把 index.html 里 assets/hub.{css,js} 的 ?v=__BUILD__ 换成当次提交的短 SHA。
      #
      # 为什么需要这一步：GitHub Pages 给静态文件发的缓存头大约 10 分钟。如果资源 URL
      # 永远不变，改版后浏览器或 CDN 就会把「新的 index.html / hub.js」和「旧的 hub.css」
      # 拼在一起用 —— 曾经真的因此把页头渲染成：计数行被标签行压住、搜索框被撑成整页宽。
      # 每次部署换一个新 URL，页面和它引用的资源就永远配对；代价只是每次多下载一次资源。
      #
      # 失败时直接报错停止：占位符没换掉等于把 __BUILD__ 当版本号发出去，
      # 那还不如不发（下一个提交又会是同一个 URL，缓存问题原样复发）。
      - name: 给静态资源打上版本号
        run: |
          set -euo pipefail
          V="${GITHUB_SHA:0:7}"
          sed -i "s/__BUILD__/${V}/g" index.html
          if grep -q "__BUILD__" index.html; then
            echo "::error title=版本号没写进去::index.html 里还残留 __BUILD__ 占位符"
            exit 1
          fi
          echo "本次部署的资源版本号 = ${V}"
          grep -n 'assets/hub\.' index.html

      # 这里刻意不带 enablement: true。
      # 那个开关想用工作流自带的 GITHUB_TOKEN 去调 POST /repos/{owner}/{repo}/pages
      # 建 Pages 站点，而 GITHUB_TOKEN 没有这个权限，必然报
      #   HttpError: Resource not accessible by integration
      # configure-pages 自己的定义里也写明了：enablement「requires a token other than
      # GITHUB_TOKEN to be provided」（需要 PAT 或 GitHub App 令牌）。
      # 所以开启 Pages 这件事只能在 Settings → Pages 里点一次，点完这步就正常了。
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
