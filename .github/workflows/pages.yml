# 演示厅的本体部署：本仓库自己的 GitHub Pages。
#
# 对外地址：https://abitginger.top/WebDemos/
#   （项目站点的路径固定等于仓库名；abitginger.github.io 是别名，会 301 过去）
# 单个演示：https://abitginger.top/WebDemos/demos/<slug>/
#
# 零构建：仓库里的文件就是站点产物，直接上传整个仓库。
# upload-pages-artifact 会自动排除 .git、.github 以及根目录下所有点开头的文件，
# 所以工作流和 .gitignore 不会出现在站点上（README.md / ADDEMO.md / scripts/ 会，
# 但仓库本来就是公开的，无所谓）。
#
# 首次部署：仓库 Settings → Pages → Source 选 GitHub Actions；
# 下面的 configure-pages 带 enablement: true，通常能自动打开。
name: 部署演示厅

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 清单与目录对不上时给出提示，但不阻断部署（避免一个笔误把站点卡住）
      - name: 校验 demos.json
        continue-on-error: true
        run: python scripts/check.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
